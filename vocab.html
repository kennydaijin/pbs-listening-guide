<script>
  (function () {
    "use strict";

    var ENTRIES = [
      ["2026-08-21", "exploit", "悪用する、(資源・機会を)活用する（動詞）／功績、偉業（名詞）", "動詞としては「(人・状況などを)自分の利益のために不当に利用する」というやや否定的な意味で使われることが多く、\"exploit workers\"（労働者を搾取する）のように使われる。一方で\"exploit natural resources\"（天然資源を活用する）のように中立的に「有効活用する」の意味でも使われ、文脈で判断が必要。名詞としては「勇敢な行い、功績」という全く別の意味を持つ点にも注意。", "The company was criticized for exploiting cheap labor overseas.", "ビジネス英会話教材の語彙リスト画面「Free Talk with More Words」(AGE [Super] 14-2, ALC EDUCATION INC.) (2026-08-21T11-20-29-788Z_EA79B738-5493-4BEB-9182-11AED608F918.png)"],
      ["2026-08-21", "menace", "脅威、危険な存在（名詞）／脅かす（動詞）", "threatとほぼ同義だが、menaceは人や動物、社会問題など「継続的に危険をもたらす存在そのもの」を指すニュアンスが強く、\"a menace to society\"のように使われる。いたずら好きで手に負えない人を軽くからかって\"He's a real menace!\"のように使う口語的用法もある。", "Speeding drivers are a menace to pedestrians in this neighborhood.", "ビジネス英会話教材の語彙リスト画面「Free Talk with More Words」(AGE [Super] 14-2, ALC EDUCATION INC.) (2026-08-21T11-20-29-788Z_EA79B738-5493-4BEB-9182-11AED608F918.png)"],
      ["2026-08-21", "savvy", "精通している、知識・実践力がある（形容詞）／実践的な知識、勘（名詞）", "\"business savvy\"や\"tech-savvy\"のように名詞の前後にハイフンでつけて「〜に精通した」という形容詞としてよく使われるくだけた語。単なる知識(knowledge)よりも、実際の場面で役立つ実践的な判断力・勘というニュアンスが強く、ビジネス英語や口語で頻出する。", "She has the marketing savvy to turn this small business into a success.", "ビジネス英会話教材の語彙リスト画面「Free Talk with More Words」(AGE [Super] 14-2, ALC EDUCATION INC.) (2026-08-21T11-20-29-788Z_EA79B738-5493-4BEB-9182-11AED608F918.png)"],
      ["2026-08-21", "resilient", "回復力のある、打たれ強い（形容詞）", "困難・逆境・変化に直面してもすぐに立ち直る力を表す形容詞で、人だけでなく経済・組織・素材などにも使われる（\"resilient economy\"など）。名詞形はresilience。似た意味のtoughが「精神的・肉体的な強さ」を表すのに対し、resilientは「打撃を受けても元に戻る回復力」に焦点がある。", "Despite the setbacks, the team remained resilient and finished the project on time.", "ビジネス英会話教材の語彙リスト画面「Free Talk with More Words」(AGE [Super] 14-2, ALC EDUCATION INC.) (2026-08-21T11-20-29-788Z_EA79B738-5493-4BEB-9182-11AED608F918.png)"],
      ["2026-08-21", "terminate", "終了させる、解雇する（動詞）", "endよりもフォーマルで硬い響きを持ち、契約・雇用・妊娠などを公式に終わらせる場面で使われる。特に\"terminate an employee/contract\"のように、雇用契約を打ち切る＝解雇するという意味でビジネス文脈頻出。名詞形terminationも同様の意味で使われる。", "The company decided to terminate his contract after the investigation.", "ビジネス英会話教材の語彙リスト画面「Free Talk with More Words」(AGE [Super] 14-2, ALC EDUCATION INC.) (2026-08-21T11-20-29-788Z_EA79B738-5493-4BEB-9182-11AED608F918.png)"],
      ["2026-08-21", "hallmark", "特徴、証、太鼓判（名詞）", "元々は貴金属の品質を証明する「刻印」を指す語だが、比喩的に「〜の特徴・証」という意味で頻繁に使われる（例: \"the hallmark of good leadership\"）。動詞としても「〜を特徴づける」という意味で使えるが、名詞用法の方が圧倒的に多い。featureやcharacteristicより「決定的な、際立った特徴」というニュアンスが強い。", "Attention to detail is the hallmark of a skilled craftsman.", "ビジネス英会話教材の語彙リスト画面「Free Talk with More Words」(AGE [Super] 14-2, ALC EDUCATION INC.) (2026-08-21T11-18-41-242Z_E5A5F9ED-5E73-41E9-B8B1-07D263954284.png)"],
      ["2026-08-21", "chattel", "動産、財産（名詞）", "不動産(real estate)と対比される「動産」を指す法律用語で、日常会話ではほとんど使われず契約書や法律文書に限定して登場する硬い語。しばしば\"goods and chattels\"のようにセットフレーズで使われる。歴史的には奴隷制度の文脈で「人を所有物として扱う」意味でも使われたため使用には注意が必要。", "Under the agreement, all chattels in the house were to be divided equally between the heirs.", "ビジネス英会話教材の語彙リスト画面「Free Talk with More Words」(AGE [Super] 14-2, ALC EDUCATION INC.) (2026-08-21T11-18-41-242Z_E5A5F9ED-5E73-41E9-B8B1-07D263954284.png)"],
      ["2026-08-21", "illicit", "不法な、違法な、道徳的に許されない（形容詞）", "illegalとほぼ同義だが、illicitは社会的・道徳的に非難されるニュアンスを伴うことが多く、\"illicit drugs\"（違法薬物）や\"illicit affair\"（不倫関係）のように使われる。illegalが単に法律違反であることを客観的に示すのに対し、illicitは隠れて行われる不正行為というニュアンスを含むやや硬い書き言葉。", "The company was fined for its illicit trading practices.", "ビジネス英会話教材の語彙リスト画面「Free Talk with More Words」(AGE [Super] 14-2, ALC EDUCATION INC.) (2026-08-21T11-18-41-242Z_E5A5F9ED-5E73-41E9-B8B1-07D263954284.png)"],
      ["2026-08-21", "forged", "偽造された（形容詞）／forge（動詞）＝偽造する", "主に\"forged document\"（偽造文書）や\"forged signature\"（偽造署名）のように、書類や署名など特定の物を模倣して不正に作ったものを表す際に使われる。counterfeitが商品全般に幅広く使われるのに対し、forgedは文書・美術品・署名など「手作業で模倣された物」に使われる傾向が強い。動詞forgeには「（金属を）鍛造する」という全く別の意味もあるため文脈に注意。", "The painting turned out to be a forged copy of the original masterpiece.", "ビジネス英会話教材の語彙リスト画面「Free Talk with More Words」(AGE [Super] 14-2, ALC EDUCATION INC.) (2026-08-21T11-18-41-242Z_E5A5F9ED-5E73-41E9-B8B1-07D263954284.png)"],
      ["2026-08-21", "counterfeit", "偽造の、偽物の（形容詞）／偽造品（名詞）／偽造する（動詞）", "\"counterfeit money\"（偽札）や\"counterfeit goods\"（偽造品）のように、本物に似せて違法に作られた物を指す。同義語のfakeよりも法律・ビジネス文脈でよく使われるフォーマルな語で、ニュースや契約書などでも頻出する。動詞としても使え、\"counterfeit a signature\"のように「偽造する」という意味になる。", "The police seized a large shipment of counterfeit handbags at the port.", "ビジネス英会話教材の語彙リスト画面「Free Talk with More Words」(AGE [Super] 14-2, ALC EDUCATION INC.) (2026-08-21T11-18-41-242Z_E5A5F9ED-5E73-41E9-B8B1-07D263954284.png)"],
      ["2026-08-20", "tell off", "叱る、しかりつける（句動詞・口語）", "\"tell somebody off (for doing something)\"の形で使われ、悪いことをした相手を厳しく叱ることを表す。受動態\"get told off\"（叱られる）も非常によく使われる、ややくだけた表現。よりフォーマルな\"reprimand\"や\"scold\"に比べて、親が子供を叱る、教師が生徒を叱るといった日常的な場面で使われることが多い。", "My dad told me off for coming home so late last night.", "英会話レッスンアプリの語彙Q&A画面（Stage 8, Lesson 126） (2026-08-20T13-32-49-154Z_A0EE3449-96B7-415A-9127-A53AFB1DC769.png)"],
      ["2026-08-20", "steady hand", "震えない安定した手先、器用で落ち着いた手（名詞句）", "\"a steady hand\"の形で使われ、外科医やピアニストなど、細かく正確な手の動きが求められる職業について語る際の定番表現。文字通りには「震えない手」を指すが、緊張やプレッシャーの中でも動じない冷静さを比喩的に表すこともある。\"have a steady hand\"（安定した手先を持っている）の形が特によく使われる。", "Surgeons need a steady hand, especially during delicate operations.", "英会話レッスンアプリの語彙Q&A画面 (2026-08-20T13-31-34-767Z_7C17BF11-FE3D-4376-AD34-29D8AB3975ED.png)"],
      ["2026-08-20", "break out", "(戦争・火事・伝染病などが)急に起こる、発生する（句動詞）", "war, fire, disease, violence, panicなど好ましくない出来事を主語にとり、「予期せず突然発生する」ことを表す。startやbeginよりも「急激に、抑えが効かない形で」というニュアンスが強い。\"break out of prison\"（脱獄する）のように、閉じ込められた場所から抜け出すという意味でも使われる。", "Riots broke out in several cities after the announcement.", "英会話レッスンアプリの語彙Q&A画面（Stage 8, Lesson 126） (2026-08-20T13-30-23-081Z_402691EF-1E1B-441B-B75C-D9FC99E22D1C.png)"],
      ["2026-08-20", "seize", "素早く強くつかむ、奪い取る、(機会を)捉える（動詞）", "「勢いよく、力ずくで奪う・つかむ」という意味の動詞で、\"seize a bag/weapon\"のように物を奪う場面や、\"seize the opportunity\"のように好機を逃さずつかむ場面で使われる。snatchより硬く公的な響きがあり、警察が物を押収する、犯人が人質を捕らえるといったニュース・法律関連の文章でも頻出する。過去形・過去分詞はseized。", "The police seized a large quantity of drugs during the raid.", "英会話レッスンアプリの語彙Q&A画面（Stage 8, Lesson 126） (2026-08-20T13-30-23-081Z_402691EF-1E1B-441B-B75C-D9FC99E22D1C.png)"],
      ["2026-08-20", "leave out", "〜を省く、除外する（句動詞）", "\"leave A out\"または\"leave out A\"の形で使われ、何かを意図的に、あるいは不注意で含めないことを表す。似た意味の\"omit\"よりも口語的でカジュアルな響きを持つ。画像の文中では、住所は書いても郵便番号を書き忘れる（省く）という意味で使われている。", "Don't leave out any important details when you tell the story.", "英会話レッスンアプリの語彙Q&A画面（Stage 8, Lesson 124） (2026-08-20T13-29-19-797Z_647E8CC4-AF35-4643-B02E-778F7F0FAE3F.png)"],
      ["2026-08-17", "struggle with ~", "〜に苦労する、〜と格闘する（動詞句）", "\"struggle with + 名詞/動名詞\"の形で、解決が難しい問題や困難な状況にもがきながら取り組んでいる様子を表す。\"be troubled by ~\"（〜に悩まされる）と似た文脈でも使われるが、struggleの方が「自分の力で乗り越えようと努力している」という能動的なニュアンスが強く、be troubled byはより受け身的に「困惑している・苦しめられている」という響きになる。ニュース記事やビジネス英語で頻出する中立的な表現。", "Our team is struggling with a tight deadline this week.", "ChatGPTの英語学習チャット画面（例文一覧） (2026-08-17T21-27-30-364Z_3DCA0D43-F2C3-4440-8109-31ADADA4773E.png)"],
      ["2026-08-17", "struggle with ~", "〜に苦労する、〜と格闘する（動詞句）", "直後に問題・課題・困難な状況を表す名詞や動名詞を続けて使う（例: struggle with inflation, struggle with pronunciation）。sufferやbe troubled byと意味が近いが、struggleは「努力しているのになかなか解決しない」という能動的にもがいているニュアンスが強い。ニュース記事やビジネス文書で頻出する表現。", "Many small businesses are struggling with rising costs and labor shortages.", "英語学習チャットの例文一覧画面 (2026-08-17T05-11-02-672Z_3DCA0D43-F2C3-4440-8109-31ADADA4773E.png)"],
      ["2026-08-16", "overhead", "諸経費、間接費（名詞）", "家賃・光熱費・保険料など、製品やサービスを直接作るためではなく、事業を運営し続けるために継続的にかかる費用を指す。複数形の\"overheads\"（特にイギリス英語）や\"overhead costs\"の形でもよく使われ、原材料費のような直接費（direct costs）とは区別される。\"cut overhead\"（経費を削減する）のようにコスト管理の文脈で頻出する。", "The company reduced its overhead by moving to a smaller office and cutting administrative staff.", "英会話レッスンアプリのキャッシュフロー語彙Q&A画面 (2026-08-16T09-48-50-426Z_1A5181C9-08B0-4EBF-B9A2-308EC0D1D7E5.png)"],
      ["2026-08-16", "per annum", "年あたり、年につき（副詞句）", "ラテン語由来のフォーマルな表現で、\"per year\"のかたい言い換え。給与・利率・年間支払額などビジネス・金融文書でよく使われ、日常会話では\"a year\"の方が一般的。数字の直後に置いて「〜万ポンド/年」のように使う。", "The position offers a starting salary of £35,000 per annum.", "英会話レッスンアプリの語彙Q&A画面 (2026-08-16T09-47-53-756Z_CEFD6599-9F3D-4D04-B130-4061B10C6CA0.png)"],
      ["2026-08-16", "overdraft", "当座借越、オーバードラフト（名詞）", "\"How can a business address cash flow issues?\" の答えの中で \"by obtaining an overdraft or a loan to pay wages and overheads\" の部分が手書きの丸で囲まれていた。銀行口座の残高を超えて一時的にお金を引き出せる融資の仕組みを指す。", "The bank gave the small business a $10,000 overdraft to cover payroll during slow months.", "英会話レッスンアプリのキャッシュフロー語彙Q&A画面 (2026-08-16T01-13-50-438Z_3188DE63-6024-4FB2-8A11-5B2B50C1C2E6.png)"],
      ["2026-08-15", "subsidy", "補助金、助成金（名詞）", "ビジネス対話文（Skit 5-1）の中で、\"the subsidy\"に下線、\"program\"の周辺に丸が付けられており、\"extend the subsidy program\"（補助金制度を延長する）の\"subsidy\"部分が対象語と判断した。文中では政府がハイブリッド車購入者に出す補助金について使われている。", "The government offers a subsidy to farmers who switch to organic farming.", "ビジネス英会話教材のダイアログ画面「Skit 5-1」(AGE [Super] 14-1, ALC EDUCATION INC.) (2026-08-15T11-53-22-381Z_IMG_1104.jpeg)"],
      ["2026-08-15", "ballpark", "おおよその、概算の（形容詞的用法）", "\"ballpark estimate\"/\"ballpark figure\"の形で使われ、正確な数字ではなく大まかな数字を表す。画像では\"estimate\"（概算見積もり）と\"quote\"（確定見積もり）を対比する文脈で、\"ballpark\"が手書きの丸で囲まれていた。", "Can you give me a ballpark figure for how much the renovation will cost?", "英会話レッスン教材の見積もり語彙Q&A画面 (2026-08-15T02-58-52-405Z_IMG_1062.jpg)"],
      ["2026-08-15", "counterfeit", "偽造する（動詞）／偽造の（形容詞）／偽造品（名詞）", "画像では\"counterfeiting\"という-ing形（動名詞・名詞用法）で手書きの丸で囲まれていた。\"the leading one is counterfeiting: fake goods that are imitations of ours\"（主要な原因は偽造、つまり自社製品を模倣した偽物）という文脈で使われている。", "The company sued several online retailers for selling counterfeit handbags.", "スキット教材のスライド「Skit 1-1」 (2026-08-15T11-36-31-896Z_IMG_1103.jpeg)"],
      ["2026-08-15", "durable", "耐久性のある、長持ちする（形容詞）", "Key Wordのペア一覧の中で手書きの丸で囲まれていた。ペアの相手が\"expire\"（期限切れになる）であることから、「（期限切れせず）長く使える」という対比の文脈で使われていると考えられる。", "These shoes are made from durable materials that last for years.", "英語学習アプリ（ビジネス語彙のKey Word練習画面） (2026-08-15T10-42-29-517Z_IMG_1102.jpeg)"],
      ["2026-08-15", "expertise", "専門知識、専門技術（名詞・不可算）", "Key Wordのペア一覧の中で手書きの丸で囲まれていた。ペアの相手が\"consultant\"（コンサルタント）であることから、専門家が持つ知識・技能を指す文脈で使われていると考えられる。", "We hired a consultant with expertise in cybersecurity.", "英語学習アプリ（ビジネス語彙のKey Word練習画面） (2026-08-15T10-42-29-517Z_IMG_1102.jpeg)"],
      ["2026-08-15", "property", "財産、資産／所有物（名詞）", "Key Wordのペア一覧の中で手書きの丸で囲まれていた。ペアの相手が\"trademark\"（商標）であることから、\"intellectual property\"（知的財産）の文脈で使われていると考えられる。", "The company took legal action to protect its intellectual property.", "英語学習アプリ（ビジネス語彙のKey Word練習画面） (2026-08-15T10-42-29-517Z_IMG_1102.jpeg)"],
      ["2026-08-15", "mortgage", "住宅ローン、抵当（名詞）", "銀行融資・経済語彙の一覧の中で手書きの丸で囲まれていた。本文では\"decline a request for a mortgage\"（住宅ローンの申し込みを断る）という文脈で使われている。", "We took out a 30-year mortgage to buy our first house.", "英会話レッスンアプリの語彙学習画面 (2026-08-15T07-01-27-944Z_F8F9A360-7899-45BB-B762-10292E85F48C.png)"],
      ["2026-08-15", "downturn", "(景気の)下降、後退（名詞）", "経済が悪化する局面を表す名詞。本文では\"a serious downturn in the economy\"という形で、recession（不況）と並んで使われている。", "The company had to lay off staff during the economic downturn.", "英会話レッスンアプリの語彙学習画面 (2026-08-15T04-31-47-944Z_67C28974-3A05-4249-A110-7542C0D0B2E6.png)"],
      ["2026-08-15", "upturn", "(景気の)好転、上向き（名詞）", "downturnの対義語で、状況が上向きに改善することを表す。本文では\"What's the opposite of the word 'downturn'?\"（downturnの対義語は？）の答えとして使われている。", "Economists expect an upturn in consumer spending next quarter.", "英会話レッスンアプリの語彙学習画面 (2026-08-15T04-31-47-944Z_67C28974-3A05-4249-A110-7542C0D0B2E6.png)"],
      ["2026-08-15", "obsolete", "時代遅れの、廃れた（形容詞）", "使われなくなった、時代に合わなくなったものを表す形容詞。本文では\"the stock is now obsolete\"（在庫が売れ残って時代遅れになった＝陳腐化した）という文脈で、手書きの丸で囲まれていた。", "This computer software is now obsolete and has been replaced by a newer version.", "英語学習アプリ（ビジネス語彙のリスニング教材） (2026-08-15T03-38-23-429Z_431C61C5-4125-41A7-A9CA-B0918E42D444.png)"],
      ["2026-08-15", "sack", "（人を）クビにする、解雇する（動詞）", "fire, lay off, make redundant, downsizeと並ぶ「解雇する」の同義語の一つとして手書きの丸で囲まれていた。会話文中では\"has been sacked\"（受動態）の形で使われ、\"自分に非があってクビになる\"というニュアンスで説明されている。", "He was sacked for stealing from the company.", "英語学習アプリ（雇用・解雇語彙のリスニング教材） (2026-08-15T03-24-27-888Z_BC9E81BD-09F5-4407-AC42-659303FC7976.png)"],
      ["2026-08-15", "per annum", "1年につき、年あたり（副詞句）", "ラテン語由来のフォーマルな表現で、年収や年利など金額を「年単位」で示す際に使う。本文では\"I reckon ... earns about ... per annum\"のように、給与額を答える例文の中で丸で囲まれていた。", "The position offers a starting salary of £35,000 per annum.", "英語学習アプリ（給与・会計語彙のクイズ） (2026-08-15T03-17-21-232Z_8573F621-D2E3-4147-BA1C-939E3FC3A9C6.png)"],
      ["2026-08-15", "per annum", "1年につき、年あたり（副詞句）", "ラテン語由来のフォーマルな表現で、年収や年利など金額を「年単位」で示す際に使う。本文では\"I reckon ... earns about ... per annum\"のように、給与額を答える例文の中で丸で囲まれていた。", "The position offers a starting salary of £35,000 per annum.", "英語学習アプリ（給与・会計語彙のクイズ） (2026-08-15T03-09-54-978Z_8573F621-D2E3-4147-BA1C-939E3FC3A9C6.png)"],
      ["2026-08-15", "trade credit", "掛け売り・仕入先信用（名詞）", "仕入先(supplier)が代金の即時支払いを求めず、後払いを認める取引形態を指すビジネス用語。ビジネス英単語一覧の中で手書きの丸で囲まれていた。cash flow（資金繰り）を管理する手段の一つとして紹介される文脈。", "Many small businesses rely on trade credit from their suppliers to manage cash flow.", "ビジネス英語教材アプリ (2026-08-15T03-03-49-262Z_D864BEB9-1347-4C4A-AA1C-ADDA6B9CB5B3.png)"],
      ["2026-08-14", "tolerance", "許容度、我慢できる限度（名詞）", "\"tolerance for X\"で「Xに対する許容度」の意味。本文では\"tolerance for AI mistakes is close to zero\"（AIのミスに対する許容度はほぼゼロに近い）という形で使われている。", "Some industries have zero tolerance for errors, especially in safety-critical systems.", "BBC (bbc.com) (ECC097E2-9675-4EF1-90F4-EAB9846B5EF6.png)"],
      ["2026-08-14", "prop up", "（通貨・価格などを）支える、下支えする（句動詞）", "\"prop\"（支柱）＋\"up\"の組み合わせで、崩れそうなものを一時的に支える、という意味の句動詞。本文の見出し\"US and Japan take action to prop up yen\"は「米国と日本は円を下支えするために行動を起こした」の意味。", "The central bank intervened to prop up the currency after it hit a record low.", "BBC (bbc.com) (ECC097E2-9675-4EF1-90F4-EAB9846B5EF6.png)"],
      ["2026-08-14", "of all stripes", "あらゆる種類の、あらゆる立場の（イディオム）", "\"people/politicians of all stripes\"のように、様々なタイプ・立場の人々を指す定型表現。本文では\"Hall of Famers of all stripes open Field of Dreams Game festivities\"という見出しで使われている。", "The festival attracts musicians of all stripes, from jazz to rock.", "MLB.com (S__19439625.jpg)"],
      ["2026-08-14", "milestone", "画期的な出来事、節目（名詞）", "本来は「路標石」の意味だが、比喩的に重要な出来事・節目を指す。本文では\"Stats of the Week: Milestones for ... and more\"という見出しで、選手の記録的な達成を紹介する文脈で使われている。", "Winning the championship was a major milestone in her career.", "MLB.com (S__19439625.jpg)"],
      ["2026-08-14", "meteorological", "気象の（形容詞）", "\"meteorological agency\"で「気象庁」のような気象観測・予報を行う機関を指す。本文では\"Japan's Meteorological Agency said the recent deluge was brought by...\"という形で使われている。", "The meteorological agency issued a severe weather warning ahead of the storm.", "BBC News (Japan floods記事) (S__19439623_0.jpg)"],
      ["2026-08-14", "authority", "当局（名詞、通常複数形で使う）", "ここでの\"authorities\"は「権威」ではなく、地方自治体・行政機関などの「当局」の意味。本文では\"Local authorities issued a level five emergency warning\"という形で使われている。", "Local authorities have issued an evacuation order for the coastal area.", "BBC News (Japan floods記事) (S__19439622_0.jpg)"],
      ["2026-08-14", "unprecedented", "前例のない、かつてない（形容詞）", "記録的な事態を強調する語で、ニュース記事で頻出する。本文では\"The rains, which authorities have described as 'unprecedented'\"のように、当局のコメントを引用する形で使われている。", "The pandemic caused unprecedented disruption to the global economy.", "BBC News (Japan floods記事) (S__19439624.jpg)"],
      ["2026-08-14", "recommendation", "提言、勧告、推薦（名詞）", "動詞\"recommend\"の名詞形。フォーマルな文脈では\"make a recommendation\"/\"make recommendations\"のように\"make\"と組み合わせて使われることが多い。本文では\"uses this information to produce reports and make recommendations for the financial health of a business\"という形で使われている。", "The consultant made a recommendation to improve customer service.", "accountant/bookkeeping教材 (S__19439620_0.jpg)"],
      ["2026-08-14", "multinational", "多国籍の、多国籍企業の（形容詞）", "単に他国に製品を売っているだけでなく、複数の国に重要な事業拠点を持つ企業を指す。本文では\"By a multinational company, we mean a business that has significant operations based in several different countries\"と定義されている。", "Coca-Cola is a well-known multinational company with operations in over 200 countries.", "LESSON 7 \"multinational\" 教材 (S__19439619_0.jpg)"],
    ];

    var listEl = document.getElementById("vocab-list");
    var countEl = document.getElementById("count");
    var emptyEl = document.getElementById("empty");
    var searchEl = document.getElementById("search");

    function el(tag, className, html) {
      var e = document.createElement(tag);
      if (className) e.className = className;
      if (html !== undefined) e.innerHTML = html;
      return e;
    }

    function render(filter) {
      var q = (filter || "").trim().toLowerCase();
      listEl.innerHTML = "";
      var shown = 0;
      var frag = document.createDocumentFragment();

      ENTRIES.forEach(function (entry) {
        var date = entry[0], word = entry[1], mean = entry[2], exp = entry[3], ex = entry[4], src = entry[5];
        if (q && word.toLowerCase().indexOf(q) === -1 && mean.toLowerCase().indexOf(q) === -1) return;

        var li = el("li", "vcard");
        var head = el("div", "vcard-head");
        head.appendChild(el("span", "word", "<b>" + word + "</b> <span class=\"mean\">" + mean + "</span>"));
        head.appendChild(el("span", "date", date));
        li.appendChild(head);
        li.appendChild(el("p", "exp", exp));
        li.appendChild(el("p", "ex", ex));
        li.appendChild(el("p", "src", src));
        frag.appendChild(li);
        shown++;
      });

      listEl.appendChild(frag);
      countEl.textContent = shown + " / " + ENTRIES.length + "件";
      emptyEl.hidden = shown !== 0;
    }

    searchEl.addEventListener("input", function () {
      render(searchEl.value);
    });

    render("");
  })();
